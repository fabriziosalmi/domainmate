version: 2

updates:
  # Python dependencies are pinned to exact versions in requirements.txt,
  # so every upgrade arrives as a reviewable pull request.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow actions are pinned to commit SHAs (see slopless.yml); Dependabot
  # keeps the SHA current and records the tag it corresponds to.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5

  # VitePress toolchain for the documentation site.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
